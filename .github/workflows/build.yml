name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android App Cleanly
        run: |
          # Backup user's main.dart
          cp lib/main.dart /tmp/main.dart.bak

          # Re-create flutter skeleton properly
          rm -rf test
          flutter create . --project-name ai_studio_mobile --org com.aistudio.app

          # Restore our custom code
          cp /tmp/main.dart.bak lib/main.dart

          # Add required dependencies
          flutter pub add http video_player cached_network_image dio gal path_provider shared_preferences

          # Set minSdk to 23 for Gal package
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle 2>/dev/null || true

          # Permissions
          sed -i '/<manifest/a <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
